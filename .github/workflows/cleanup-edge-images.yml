name: Withdraw old Edge images

on:
  workflow_dispatch:
    inputs:
      keep_version:
        description: Edge version that must remain available
        required: true
        default: 1.1.3

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only explicitly versioned legacy manifests
        uses: actions/github-script@v8
        env:
          KEEP_VERSION: ${{ inputs.keep_version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner.toLowerCase()
            const packageName = 'alqq-edge-agent'
            const keepVersion = process.env.KEEP_VERSION
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              {
                username: owner,
                package_type: 'container',
                package_name: packageName,
                per_page: 100,
              },
            )

            const deleted = []
            for (const version of versions) {
              const tags = version.metadata?.container?.tags || []
              const legacyTags = tags.filter(tag => /^\d+\.\d+\.\d+(?:-(?:amd64|arm64))?$/.test(tag))
              const protectedVersion = tags.some(tag =>
                tag === keepVersion || tag === `${keepVersion}-amd64` || tag === `${keepVersion}-arm64`,
              )
              if (protectedVersion || legacyTags.length === 0) continue

              await github.rest.packages.deletePackageVersionForUser({
                username: owner,
                package_type: 'container',
                package_name: packageName,
                package_version_id: version.id,
              })
              deleted.push(...legacyTags)
            }

            core.notice(`Deleted legacy tagged manifests: ${deleted.join(', ') || 'none'}`)
