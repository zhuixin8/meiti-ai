name: Publish Edge multi-arch images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Edge release tag (for example edge-v1.1.6)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'edge-v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Download and verify signed image archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^edge-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#edge-v}"
          ARCHIVE="alqq-edge-agent-${VERSION}-linux-${IMAGE_ARCH}.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256" \
            --pattern "$ARCHIVE.sig" --pattern release-signing-public.pem
          KEY_HASH="$(openssl pkey -pubin -in release-signing-public.pem -outform DER | sha256sum | cut -d ' ' -f1)"
          test "$KEY_HASH" = d3299865b968a244cdb1fcc563053c39a0c7576f2d43ad25a4f45216863893d9
          sha256sum -c "$ARCHIVE.sha256"
          openssl pkeyutl -verify -pubin -inkey release-signing-public.pem -rawin \
            -in "$ARCHIVE" -sigfile "$ARCHIVE.sig"
          gzip -dc "$ARCHIVE" | docker load
          test "$(docker image inspect --format '{{.Architecture}}' "alqq/edge-agent:${VERSION}")" = "$IMAGE_ARCH"

      - name: Verify browser on native architecture
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#edge-v}"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 512 --memory 3g --shm-size 1g \
            --tmpfs /tmp:size=512m,mode=1777 --tmpfs /data:size=64m,uid=10001,gid=10001 \
            -e LOG_DIR=/tmp/edge-browser-test-logs -e ALQQ_DATA_DIR=/tmp/edge-browser-test-data \
            --entrypoint node "alqq/edge-agent:${VERSION}" -e '
          const assert = require("node:assert/strict")
          const root = "/opt/alqq/engine"
          const req = require("node:module").createRequire(root + "/package.json")
          req("bytenode")
          const deadline = setTimeout(() => { console.error("Browser smoke test timed out"); process.exit(2) }, 60000)
          async function main() {
              const factory = req(root + "/server/utils/browserFactory")
              const browser = await factory.chromium.launch(factory.buildLaunchOptions({ headless: true, proxyMode: "direct" }))
              try {
                  const page = await browser.newPage()
                  await page.goto("data:text/html,<h1>ALQQ native browser verified</h1>", { waitUntil: "domcontentloaded", timeout: 20000 })
                  assert.equal(await page.locator("h1").textContent(), "ALQQ native browser verified")
                  console.log(JSON.stringify({ arch: process.arch, node: process.version, browser: true, externalPublishing: false }))
              } finally { await browser.close() }
          }
          main().then(() => clearTimeout(deadline)).catch(error => { clearTimeout(deadline); console.error(error); process.exitCode = 1 })
          '

      - name: Publish architecture image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#edge-v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "alqq/edge-agent:${VERSION}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alqq-edge-agent:${VERSION}-${IMAGE_ARCH}"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alqq-edge-agent:${VERSION}-${IMAGE_ARCH}"

  manifest:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish multi-arch manifest
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^edge-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#edge-v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alqq-edge-agent"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
